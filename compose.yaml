services:
  app:
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8088}:8080"
    environment:
      GIN_MODE: release
      APP_ADDRESS: :8080
      DATABASE_PATH: /app/data/sakura-tools.db
      FRONTEND_DIR: /app/public
      TZ: Asia/Shanghai
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
      DEEPL_ENDPOINT: ${DEEPL_ENDPOINT:-}
      MYMEMORY_EMAIL: ${MYMEMORY_EMAIL:-}
      ANALYTICS_ADMIN_TOKEN: ${ANALYTICS_ADMIN_TOKEN:-}
      ANALYTICS_RAW_RETENTION_DAYS: ${ANALYTICS_RAW_RETENTION_DAYS:-14}
      PADDLEOCR_API_BASE: ${PADDLEOCR_API_BASE:-}
      PADDLEOCR_API_TOKEN: ${PADDLEOCR_API_TOKEN:-}
      PADDLEOCR_MODEL: ${PADDLEOCR_MODEL:-}
      TRANSLATION_API_BASE: ${TRANSLATION_API_BASE:-}
      TRANSLATION_API_KEY: ${TRANSLATION_API_KEY:-}
      TRANSLATION_MODEL: ${TRANSLATION_MODEL:-}
      PDF_MAX_SIZE_MB: ${PDF_MAX_SIZE_MB:-18}
      PDF_MAX_PAGES: ${PDF_MAX_PAGES:-100}
      PDF_OCR_DAILY_QUOTA: ${PDF_OCR_DAILY_QUOTA:-100}
      PDF_TRANSLATE_DAILY_QUOTA: ${PDF_TRANSLATE_DAILY_QUOTA:-100}
      PDF_JOB_TTL_HOURS: ${PDF_JOB_TTL_HOURS:-24}
    volumes:
      - sakura_data:/app/data
      - /etc/pki/tls/certs/ca-bundle.crt:/etc/ssl/certs/ca-certificates.crt:ro
    read_only: true
    security_opt:
      - no-new-privileges:true

volumes:
  sakura_data:
