services:
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8088}:80"
    depends_on:
      - backend
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      GIN_MODE: release
      APP_ADDRESS: :8080
      DATABASE_PATH: /app/data/sakura-tools.db
      TZ: Asia/Shanghai
    volumes:
      - sakura_data:/app/data
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true

volumes:
  sakura_data:
